name: ${COMPOSE_PROJECT_NAME:-project-operations-center-dev}

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_operations}
      POSTGRES_USER: ${POSTGRES_USER:-project_operations}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGTZ: UTC
      TZ: UTC
    secrets:
      - source: postgres_password
        target: postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '5000'
    volumes:
      - mailpit_data:/data
    ports:
      - name: mailpit-ui
        target: 8025
        published: ${MAILPIT_HTTP_PORT:-8025}
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  attachments-maintenance:
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    profiles:
      - maintenance
    command:
      - sh
      - -eu
      - -c
      - sleep infinity
    volumes:
      - attachments_data:/srv/attachments
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true

volumes:
  postgres_data:
  mailpit_data:
  attachments_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE to a readable secret file}
