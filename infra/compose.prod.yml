name: ${COMPOSE_PROJECT_NAME:-project-operations-center-prod}

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_operations}
      POSTGRES_USER: ${POSTGRES_USER:-project_operations}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGTZ: UTC
      TZ: UTC
    secrets:
      - source: postgres_password
        target: postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true

  api:
    image: ${API_IMAGE:-project-operations-api:local}
    profiles:
      - application
    environment:
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-project_operations}
      POSTGRES_USER: ${POSTGRES_USER:-project_operations}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      NODE_ENV: production
      MFA_SECRET_KEY_FILE: /run/secrets/mfa_secret_key
      TZ: UTC
    secrets:
      - source: postgres_password
        target: postgres_password
      - source: mfa_secret_key
        target: mfa_secret_key
    volumes:
      - attachments_data:/srv/attachments
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    image: ${WEB_IMAGE:-project-operations-web:local}
    profiles:
      - application
    environment:
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      TZ: UTC
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles:
      - application
    ports:
      - name: private-http
        target: 8080
        published: ${APP_HTTP_PORT:-8080}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - frontend
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  attachments-maintenance:
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    profiles:
      - maintenance
    command:
      - sh
      - -eu
      - -c
      - sleep infinity
    volumes:
      - attachments_data:/srv/attachments
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true
  frontend:
    internal: true

volumes:
  postgres_data:
  attachments_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE to a readable secret file}
  mfa_secret_key:
    file: ${MFA_SECRET_KEY_FILE:?Set MFA_SECRET_KEY_FILE to a readable 64-hex-char secret file}
