packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

# deepmerge-ts <8.0.0 has a stack-exhaustion vulnerability (GHSA-ggr8-5vv4-36mx)
# pinned by @prisma/config@7.9.1. @prisma/config only uses the `deepmerge` function
# (no deepmergeInto / Map merging), which is unaffected by 8.0.0's breaking changes;
# 8.0.0 adds circular-reference support to `deepmerge`, which is the fix itself.
overrides:
  deepmerge-ts: 8.0.1
