packages:
  - apps/*
  - packages/*

allowBuilds:
  # embedded-postgres 的平台二进制包（Windows 本机 db:local / Linux CI 解析）都需要执行 postinstall。
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

# deepmerge-ts <8.0.0 has a stack-exhaustion vulnerability (GHSA-ggr8-5vv4-36mx)
# pinned by @prisma/config@7.9.1. @prisma/config only uses the `deepmerge` function
# (no deepmergeInto / Map merging), which is unaffected by 8.0.0's breaking changes;
# 8.0.0 adds circular-reference support to `deepmerge`, which is the fix itself.
overrides:
  deepmerge-ts: 8.0.1
  # 2026-11-06 安全升级：修复 audit 的 critical/high 公告（Next.js RCE 已由 next@16.4.1 直接修复）。
  # 这些是传递依赖，用 override 抬到已修补的最小版本，避免跨大版本跳级。
  proxy-addr: 2.0.8
  body-parser: 2.4.0
  fast-uri: 3.1.9
  js-yaml: 4.3.2
  source-map-js: 1.2.2
  undici: 8.12.2
  multer: 2.5.0
  mysql2: 3.23.1
  vite: 8.2.4
  'brace-expansion@<2.0.0': 1.1.21
  'brace-expansion@>=4.0.0': 5.0.12
  # 2026-11-08 audit：qs 的 DoS 公告（express 传递依赖）与 minimatch 的 glob 放大公告。
  # 都抬到已修补的最小版本，不跨大版本。
  qs: 6.16.1
  minimatch: 11.0.1
